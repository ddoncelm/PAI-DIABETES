[build]
  command   = "npm run build"
  publish   = "dist"

# Archivos estáticos — NO redirigir al SPA
[[redirects]]
  from   = "/formularios/*"
  to     = "/formularios/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/assets/*"
  to     = "/assets/:splat"
  status = 200
  force  = true

# Catch-all SPA
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
